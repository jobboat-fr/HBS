# CI hbs-formation — types, build, dépendances, secrets.
# Actions épinglées par empreinte : une étiquette peut être déplacée, pas un commit.
# `next lint` a disparu avec Next 16 ; le contrôle de types le remplace.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Types et build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Le build n'a pas besoin des vrais secrets : ils vivent sur Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: https://hbs-formation.fr
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  dependances:
    name: Dépendances et secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Vulnérabilités npm (bloquant à partir de « high »)
        run: npm audit --omit=dev --audit-level=high
      - name: Secrets dans l'historique
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
